<svg xmlns="http://www.w3.org/2000/svg" width="900" height="110" viewBox="0 0 900 110" role="img" aria-labelledby="t4 d4">
  <title id="t4">Engineering Velocity &amp; Systems Advisory</title>
  <desc id="d4">Section header: Activity Telemetry, Contribution Velocity, and Enterprise Architecture Advisory.</desc>
  <defs>
    <linearGradient id="sec4-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="60%" stop-color="#0D131F" />
      <stop offset="100%" stop-color="#06090F" />
    </linearGradient>
    <linearGradient id="sec4-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF87" stop-opacity="0" />
      <stop offset="30%" stop-color="#00FF87" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#00F2FE" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00FF87" stop-opacity="0" />
    </linearGradient>
    <pattern id="sec4-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.3" />
    </pattern>
    <radialGradient id="radar-sweep-cone" cx="0" cy="0" r="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FF87" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#00FF87" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00FF87" stop-opacity="0.02" />
    </radialGradient>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    @media (prefers-reduced-motion: reduce) {
      animateTransform, animate { display: none; }
    }
  </style>

  <!-- Container Box -->
  <rect x="1.5" y="1.5" width="897" height="107" rx="12" fill="url(#sec4-bg)" stroke="#1E293B" stroke-width="1.2" />
  <rect x="1.5" y="1.5" width="897" height="107" rx="12" fill="url(#sec4-grid)" />

  <!-- Left Glyph: Precision Tactical Radar Reticle -->
  <g transform="translate(56, 55)">
    <!-- Radar Scope Housing & Range Rings -->
    <circle r="33" fill="#081220" stroke="#1E293B" stroke-width="1.3" />
    <circle r="28" fill="none" stroke="#00FF87" stroke-opacity="0.25" stroke-width="0.8" />
    <circle r="18" fill="none" stroke="#00FF87" stroke-opacity="0.2" stroke-width="0.6" />
    <circle r="9" fill="none" stroke="#00F2FE" stroke-opacity="0.3" stroke-width="0.6" stroke-dasharray="2 2" />

    <!-- Crosshair Reticles with Tick Accents -->
    <line x1="-28" y1="0" x2="28" y2="0" stroke="#1E293B" stroke-width="0.8" />
    <line x1="0" y1="-28" x2="0" y2="28" stroke="#1E293B" stroke-width="0.8" />
    <line x1="-18" y1="-2" x2="-18" y2="2" stroke="#00FF87" stroke-opacity="0.5" stroke-width="0.8" />
    <line x1="18" y1="-2" x2="18" y2="2" stroke="#00FF87" stroke-opacity="0.5" stroke-width="0.8" />
    <line x1="-2" y1="-18" x2="2" y2="-18" stroke="#00FF87" stroke-opacity="0.5" stroke-width="0.8" />
    <line x1="-2" y1="18" x2="2" y2="18" stroke="#00FF87" stroke-opacity="0.5" stroke-width="0.8" />

    <!-- Rotating Sweep Beam & Trailing Phosphor Cone -->
    <g>
      <path d="M 0 0 L 0 -28 A 28 28 0 0 0 -16 -23 Z" fill="url(#radar-sweep-cone)" />
      <line x1="0" y1="0" x2="0" y2="-28" stroke="#00FF87" stroke-width="1.6" stroke-linecap="round" />
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.2s" repeatCount="indefinite" />
    </g>

    <!-- Radar Target Blips (Triggered with sweep proximity) -->
    <circle cx="14" cy="-12" r="2.2" fill="#00FF87">
      <animate attributeName="opacity" values="1;0.2;1" dur="3.2s" begin="0.8s" repeatCount="indefinite" />
      <animate attributeName="r" values="2.2;3;2.2" dur="3.2s" begin="0.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="-12" cy="14" r="2" fill="#00F2FE">
      <animate attributeName="opacity" values="1;0.2;1" dur="3.2s" begin="2.4s" repeatCount="indefinite" />
      <animate attributeName="r" values="2;2.8;2" dur="3.2s" begin="2.4s" repeatCount="indefinite" />
    </circle>

    <!-- Center Radar Core -->
    <circle cx="0" cy="0" r="3.2" fill="#00FF87" />
    <circle cx="0" cy="0" r="1.3" fill="#FFFFFF" />
  </g>

  <!-- Center Title & Subtitle -->
  <g transform="translate(112, 0)">
    <text class="mono" x="0" y="44" font-size="11" font-weight="700" fill="#00FF87" letter-spacing="2.2">
      05 // RUNTIME OBSERVABILITY &amp; ADVISORY
    </text>
    <text x="0" y="77" font-size="25" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
      Engineering Velocity &amp; Advisory
    </text>
  </g>

  <!-- Right Telemetry Badge -->
  <g transform="translate(720, 42)">
    <rect x="0" y="0" width="150" height="26" rx="13" fill="#0E1626" stroke="#00FF87" stroke-width="0.8" stroke-opacity="0.5" />
    <circle cx="14" cy="13" r="3.5" fill="#00FF87">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text class="mono" x="25" y="17" font-size="10" font-weight="700" fill="#00FF87" letter-spacing="0.8">LIVE TELEMETRY</text>
  </g>

  <!-- Bottom Accent Trace -->
  <path d="M 40 108 L 860 108" stroke="url(#sec4-accent)" stroke-width="2" stroke-linecap="round" />
</svg>
