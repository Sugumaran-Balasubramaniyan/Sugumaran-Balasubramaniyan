<svg xmlns="http://www.w3.org/2000/svg" width="900" height="110" viewBox="0 0 900 110" role="img" aria-labelledby="t4 d4">
  <title id="t4">Engineering Velocity &amp; Systems Advisory</title>
  <desc id="d4">Section header: Activity Telemetry, Contribution Velocity, and Enterprise Architecture Advisory.</desc>
  <defs>
    <linearGradient id="sec4-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="60%" stop-color="#0D131F" />
      <stop offset="100%" stop-color="#06090F" />
    </linearGradient>
    <linearGradient id="sec4-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF87" stop-opacity="0" />
      <stop offset="30%" stop-color="#00FF87" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#00F2FE" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00FF87" stop-opacity="0" />
    </linearGradient>
    <pattern id="sec4-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sweep { transform-box: fill-box; transform-origin: center; animation: sweep 8s linear infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes sweep { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .sweep, .pulse { animation: none !important; } }
  </style>

  <!-- Container Box -->
  <rect x="1.5" y="1.5" width="897" height="107" rx="12" fill="url(#sec4-bg)" stroke="#1E293B" stroke-width="1.2" />
  <rect x="1.5" y="1.5" width="897" height="107" rx="12" fill="url(#sec4-grid)" />

  <!-- Left Glyph: Radar Telemetry / Pulse Monitor -->
  <g transform="translate(56, 55)">
    <circle r="32" fill="#00FF87" fill-opacity="0.05" />
    <circle r="22" fill="none" stroke="#00FF87" stroke-opacity="0.3" stroke-width="1" />
    <circle r="12" fill="none" stroke="#00F2FE" stroke-opacity="0.4" stroke-width="0.8" />
    <line x1="0" y1="0" x2="16" y2="-16" stroke="#00FF87" stroke-width="1.5" stroke-linecap="round" class="sweep" />
    <circle cx="0" cy="0" r="3" fill="#00FF87" class="pulse" />
  </g>

  <!-- Center Title & Subtitle -->
  <g transform="translate(112, 0)">
    <text class="mono" x="0" y="44" font-size="11" font-weight="700" fill="#00FF87" letter-spacing="2.2">
      05 // RUNTIME OBSERVABILITY &amp; ADVISORY
    </text>
    <text x="0" y="77" font-size="25" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
      Engineering Velocity &amp; Advisory
    </text>
  </g>

  <!-- Right Telemetry Badge -->
  <g transform="translate(720, 42)">
    <rect x="0" y="0" width="150" height="26" rx="13" fill="#0E1626" stroke="#00FF87" stroke-width="0.8" stroke-opacity="0.5" />
    <circle cx="14" cy="13" r="3.5" fill="#00FF87">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text class="mono" x="25" y="17" font-size="10" font-weight="700" fill="#00FF87" letter-spacing="0.8">LIVE TELEMETRY</text>
  </g>

  <!-- Bottom Accent Trace -->
  <path d="M 40 108 L 860 108" stroke="url(#sec4-accent)" stroke-width="2" stroke-linecap="round" />
</svg>
