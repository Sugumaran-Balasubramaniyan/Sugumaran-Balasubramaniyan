<svg xmlns="http://www.w3.org/2000/svg" width="780" height="214" viewBox="0 0 780 214" role="img" aria-labelledby="t6 d6">
  <title id="t6">Enterprise Advisory &amp; Systems Architecture Collaboration</title>
  <desc id="d6">Consulting and advisory on production agentic AI, low-latency RAG systems, academic research partnerships, and keynote seminars.</desc>
  <defs>
    <radialGradient id="r6" cx="0.88" cy="0.5" r="0.8">
      <stop stop-color="#00F2FE" stop-opacity="0.14" />
      <stop offset="1" stop-color="#00F2FE" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid6" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sweep { animation: sweep 10s linear infinite; }
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes sweep { to { stroke-dashoffset: -100; } }
    @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .sweep, .pulse { animation: none !important; } }
  </style>

  <!-- Background Base & Grid -->
  <rect x="0.5" y="0.5" width="779" height="213" rx="14" fill="#080C14" stroke="#1E293B" stroke-width="1.2" />
  <rect x="0.5" y="0.5" width="779" height="213" rx="14" fill="url(#grid6)" />
  <rect x="0.5" y="0.5" width="779" height="213" rx="14" fill="url(#r6)" />

  <!-- Animated Border Sweep -->
  <rect class="sweep" x="0.5" y="0.5" width="779" height="213" rx="14" fill="none" stroke="#00F2FE" stroke-width="1.3" pathLength="100" stroke-dasharray="10 90" stroke-linecap="round" />

  <!-- Right Graphic: Advisory Mesh & Collaborative Server Cluster -->
  <g transform="translate(650, 107)">
    <circle r="68" fill="none" stroke="#00F2FE" stroke-opacity="0.15" />
    <circle r="46" fill="none" stroke="#00F2FE" stroke-opacity="0.25" stroke-dasharray="3 3" />

    <!-- Central Node -->
    <circle cx="0" cy="0" r="10" fill="#0E1626" stroke="#00F2FE" stroke-width="1.5" />
    <circle cx="0" cy="0" r="4" fill="#00FF87" class="pulse" />

    <!-- Surrounding Satellite Nodes -->
    <line x1="0" y1="0" x2="-32" y2="-28" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.7" />
    <circle cx="-32" cy="-28" r="4.5" fill="#38BDF8" />

    <line x1="0" y1="0" x2="34" y2="-24" stroke="#7AA2F7" stroke-width="1.2" stroke-opacity="0.7" />
    <circle cx="34" cy="-24" r="4.5" fill="#7AA2F7" />

    <line x1="0" y1="0" x2="30" y2="30" stroke="#00F2FE" stroke-width="1.2" stroke-opacity="0.7" />
    <circle cx="30" cy="30" r="4.5" fill="#00F2FE" />

    <line x1="0" y1="0" x2="-30" y2="28" stroke="#00FF87" stroke-width="1.2" stroke-opacity="0.7" />
    <circle cx="-30" cy="28" r="4.5" fill="#00FF87" />
  </g>

  <!-- Left Content Column -->
  <g transform="translate(32, 0)">
    <!-- Monospace Tag -->
    <text class="m" x="0" y="38" font-size="11" font-weight="700" letter-spacing="1.5" fill="#00F2FE">06 · SYSTEMS ADVISORY &amp; COLLABORATION</text>

    <!-- Title -->
    <text x="0" y="74" font-size="26" font-weight="700" fill="#FFFFFF">Architectural Advisory &amp; Speaking</text>

    <!-- Specs Bullets -->
    <text x="0" y="105" font-size="13.5" fill="#C9D1D9">Technical advisory for enterprise AI: Agentic Swarms, low-latency RAG, &amp; guardrails.</text>
    <text x="0" y="126" font-size="13.5" fill="#C9D1D9">Academic collaborations, joint AI safety research, and executive masterclasses.</text>
    <text x="0" y="147" font-size="13.5" fill="#C9D1D9">Available for high-impact advisory, speaking engagements, and systems consulting.</text>

    <!-- Pill Badges -->
    <g transform="translate(0, 172)">
      <rect x="0" y="0" width="108" height="22" rx="11" fill="#0E1626" stroke="#00F2FE" stroke-opacity="0.35" />
      <text class="m" x="54" y="15" text-anchor="middle" font-size="10.5" fill="#00F2FE" font-weight="600">Paris &amp; Remote</text>

      <rect x="116" y="0" width="144" height="22" rx="11" fill="#0E1626" stroke="#00F2FE" stroke-opacity="0.35" />
      <text class="m" x="188" y="15" text-anchor="middle" font-size="10.5" fill="#00F2FE" font-weight="600">Enterprise Advisory</text>

      <rect x="268" y="0" width="140" height="22" rx="11" fill="#0E1626" stroke="#00F2FE" stroke-opacity="0.35" />
      <text class="m" x="338" y="15" text-anchor="middle" font-size="10.5" fill="#00F2FE" font-weight="600">Architecture Review</text>

      <rect x="416" y="0" width="94" height="22" rx="11" fill="#0E1626" stroke="#00F2FE" stroke-opacity="0.35" />
      <text class="m" x="463" y="15" text-anchor="middle" font-size="10.5" fill="#00FF87" font-weight="600">Get in Touch</text>
    </g>
  </g>

  <!-- External Link Arrow (Top Right) -->
  <path d="M 742 32 L 752 22 M 744 22 H 752 V 30" fill="none" stroke="#00F2FE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
</svg>
