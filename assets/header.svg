<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0D131F" />
      <stop offset="100%" stop-color="#06090F" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#4FACFE" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#7AA2F7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.9" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2F1FF" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Subtle Grid Pattern -->
    <pattern id="cyber-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="896" height="216" rx="14" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5" />
  
  <!-- Subtle Grid Overlay -->
  <rect x="2" y="2" width="896" height="216" rx="14" fill="url(#cyber-grid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="120" cy="50" r="70" fill="#00F2FE" opacity="0.08" filter="url(#glow)" />
  <circle cx="780" cy="170" r="90" fill="#7AA2F7" opacity="0.08" filter="url(#glow)" />

  <!-- Top Terminal Bar -->
  <line x1="2" y1="36" x2="898" y2="36" stroke="#1E293B" stroke-width="1" stroke-opacity="0.6" />
  <circle cx="24" cy="19" r="5" fill="#FF5F56" />
  <circle cx="42" cy="19" r="5" fill="#FFBD2E" />
  <circle cx="60" cy="19" r="5" fill="#27C93F" />
  
  <!-- Terminal Prompt Title -->
  <text x="82" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Fira Code', monospace" font-size="12" fill="#64748B" font-weight="600" letter-spacing="1">
    SYSTEM://NEURAL-CORE.ARCH // PARIS-CLUSTER
  </text>

  <!-- Live Status Badge (Top Right) -->
  <g transform="translate(735, 11)">
    <rect x="0" y="0" width="140" height="18" rx="9" fill="#0F172A" stroke="#00F2FE" stroke-width="0.75" stroke-opacity="0.6" />
    <circle cx="10" cy="9" r="3.5" fill="#00FF87">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="20" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="10" fill="#00FF87" font-weight="700" letter-spacing="0.5">ONLINE • SCALING</text>
  </g>

  <!-- Main Name Title -->
  <text x="450" y="98" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif" font-size="34" font-weight="800" fill="url(#text-grad)" letter-spacing="1.5">
    SUGUMARAN BALASUBRAMANIYAN
  </text>

  <!-- Subtitle -->
  <text x="450" y="132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" fill="#94A3B8" letter-spacing="0.5">
    Senior AI/ML Systems Architect <tspan fill="#00F2FE">•</tspan> Professor of AI &amp; Data Science @ SKEMA Paris
  </text>

  <!-- Pill Highlights Row -->
  <g transform="translate(100, 160)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="160" height="28" rx="14" fill="#0E1626" stroke="#1E293B" stroke-width="1" />
    <text x="80" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11" fill="#38BDF8" font-weight="600">⚡ Agentic AI Swarms</text>

    <!-- Pill 2 -->
    <rect x="175" y="0" width="175" height="28" rx="14" fill="#0E1626" stroke="#1E293B" stroke-width="1" />
    <text x="262" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11" fill="#38BDF8" font-weight="600">🚀 &lt;20ms PGVector HNSW</text>

    <!-- Pill 3 -->
    <rect x="365" y="0" width="165" height="28" rx="14" fill="#0E1626" stroke="#1E293B" stroke-width="1" />
    <text x="447" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11" fill="#38BDF8" font-weight="600">🔬 Clinical LLM Evals</text>

    <!-- Pill 4 -->
    <rect x="545" y="0" width="155" height="28" rx="14" fill="#0E1626" stroke="#1E293B" stroke-width="1" />
    <text x="622" y="18" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11" fill="#38BDF8" font-weight="600">🎓 SKEMA AI Faculty</text>
  </g>
</svg>
