<svg xmlns="http://www.w3.org/2000/svg" width="780" height="214" viewBox="0 0 780 214" role="img" aria-labelledby="t-log d-log">
  <title id="t-log">Engineering Log: Fundamentals to Frontier AI</title>
  <desc id="d-log">First-principles computer systems log from bare-metal C allocators to GPU vLLM batching and autonomous agent swarms.</desc>
  <defs>
    <radialGradient id="r-log" cx="0.88" cy="0.5" r="0.8">
      <stop stop-color="#38BDF8" stop-opacity="0.14" />
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-log" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sweep { animation: sweep 10s linear infinite; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    @keyframes sweep { to { stroke-dashoffset: -100; } }
    @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .sweep, .pulse { animation: none !important; } }
  </style>

  <!-- Background Base & Grid -->
  <rect x="0.5" y="0.5" width="779" height="213" rx="14" fill="#080C14" stroke="#1E293B" stroke-width="1.2" />
  <rect x="0.5" y="0.5" width="779" height="213" rx="14" fill="url(#grid-log)" />
  <rect x="0.5" y="0.5" width="779" height="213" rx="14" fill="url(#r-log)" />

  <!-- Animated Border Sweep -->
  <rect class="sweep" x="0.5" y="0.5" width="779" height="213" rx="14" fill="none" stroke="#38BDF8" stroke-width="1.3" pathLength="100" stroke-dasharray="10 90" stroke-linecap="round" />

  <!-- Right Graphic: Memory Allocator & GPU KV-Cache Paging -->
  <g transform="translate(650, 107)">
    <circle r="68" fill="none" stroke="#38BDF8" stroke-opacity="0.15" />
    
    <!-- Bare-Metal Stack/Heap Memory Slabs -->
    <rect x="-38" y="-36" width="76" height="14" rx="3" fill="#0E1626" stroke="#38BDF8" stroke-width="1.2" />
    <text class="m" x="0" y="-26" text-anchor="middle" font-size="8" fill="#38BDF8" font-weight="700">KERNEL // MMAP</text>

    <rect x="-38" y="-18" width="76" height="14" rx="3" fill="#0E1626" stroke="#00F2FE" stroke-width="1.2" />
    <text class="m" x="0" y="-8" text-anchor="middle" font-size="8" fill="#00F2FE" font-weight="700">POSIX // HEAP</text>

    <rect x="-38" y="0" width="76" height="14" rx="3" fill="#0E1626" stroke="#7AA2F7" stroke-width="1.2" />
    <text class="m" x="0" y="10" text-anchor="middle" font-size="8" fill="#7AA2F7" font-weight="700">KV-CACHE PAGING</text>

    <rect x="-38" y="18" width="76" height="14" rx="3" fill="#0E1626" stroke="#00FF87" stroke-width="1.2" />
    <text class="m" x="0" y="28" text-anchor="middle" font-size="8" fill="#00FF87" font-weight="700">vLLM AGENT BATCH</text>

    <!-- Side Pointer Dot -->
    <circle cx="48" cy="25" r="3" fill="#00FF87" class="pulse" />
  </g>

  <!-- Left Content Column -->
  <g transform="translate(32, 0)">
    <!-- Monospace Tag -->
    <text class="m" x="0" y="38" font-size="11" font-weight="700" letter-spacing="1.5" fill="#38BDF8">07 · SYSTEMS RESEARCH &amp; FIRST-PRINCIPLES</text>

    <!-- Title -->
    <text x="0" y="74" font-size="25" font-weight="700" fill="#FFFFFF">Engineering Log: Bare-Metal to AI</text>

    <!-- Specs Bullets -->
    <text x="0" y="105" font-size="13.5" fill="#C9D1D9">First-principles systems log: from bare-metal C allocators to GPU serving pipelines.</text>
    <text x="0" y="126" font-size="13.5" fill="#C9D1D9">POSIX internals, custom memory managers, and lock-free thread concurrency.</text>
    <text x="0" y="147" font-size="13.5" fill="#C9D1D9">Distributed vLLM multi-GPU batching, PagedAttention, and agentic swarm loops.</text>

    <!-- Pill Badges -->
    <g transform="translate(0, 172)">
      <rect x="0" y="0" width="94" height="22" rx="11" fill="#0E1626" stroke="#38BDF8" stroke-opacity="0.35" />
      <text class="m" x="47" y="15" text-anchor="middle" font-size="10.5" fill="#38BDF8" font-weight="600">Bare-Metal C</text>

      <rect x="102" y="0" width="112" height="22" rx="11" fill="#0E1626" stroke="#38BDF8" stroke-opacity="0.35" />
      <text class="m" x="158" y="15" text-anchor="middle" font-size="10.5" fill="#38BDF8" font-weight="600">vLLM Paging</text>

      <rect x="222" y="0" width="102" height="22" rx="11" fill="#0E1626" stroke="#38BDF8" stroke-opacity="0.35" />
      <text class="m" x="273" y="15" text-anchor="middle" font-size="10.5" fill="#38BDF8" font-weight="600">GPU Batching</text>

      <rect x="332" y="0" width="108" height="22" rx="11" fill="#0E1626" stroke="#38BDF8" stroke-opacity="0.35" />
      <text class="m" x="386" y="15" text-anchor="middle" font-size="10.5" fill="#38BDF8" font-weight="600">Public Log</text>
    </g>
  </g>

  <!-- External Link Arrow (Top Right) -->
  <path d="M 742 32 L 752 22 M 744 22 H 752 V 30" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
</svg>
