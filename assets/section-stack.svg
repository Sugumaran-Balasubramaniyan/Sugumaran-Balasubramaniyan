<svg xmlns="http://www.w3.org/2000/svg" width="900" height="110" viewBox="0 0 900 110" role="img" aria-labelledby="t3 d3">
  <title id="t3">Production Engineering Matrix &amp; Stack</title>
  <desc id="d3">Section header: LLM Systems, Backend Infrastructure, High-Throughput Serving &amp; 15 Multi-Cloud Certifications.</desc>
  <defs>
    <linearGradient id="sec3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="60%" stop-color="#0D131F" />
      <stop offset="100%" stop-color="#06090F" />
    </linearGradient>
    <linearGradient id="sec3-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#00FF87" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0" />
    </linearGradient>
    <pattern id="sec3-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none !important; } }
  </style>

  <!-- Container Box -->
  <rect x="1.5" y="1.5" width="897" height="107" rx="12" fill="url(#sec3-bg)" stroke="#1E293B" stroke-width="1.2" />
  <rect x="1.5" y="1.5" width="897" height="107" rx="12" fill="url(#sec3-grid)" />

  <!-- Left Glyph: Layered Microservices & GPU Cluster -->
  <g transform="translate(56, 55)">
    <circle r="32" fill="#38BDF8" fill-opacity="0.05" />
    <path d="M -16 -10 L 0 -18 L 16 -10 L 0 -2 Z" fill="#0E1626" stroke="#38BDF8" stroke-width="1.3" />
    <path d="M -16 0 L 0 -8 L 16 0 L 0 8 Z" fill="#0E1626" stroke="#00F2FE" stroke-width="1.3" />
    <path d="M -16 10 L 0 2 L 16 10 L 0 18 Z" fill="#0E1626" stroke="#00FF87" stroke-width="1.3" />
    <circle cx="0" cy="0" r="2.5" fill="#00FF87" class="pulse" />
  </g>

  <!-- Center Title & Subtitle -->
  <g transform="translate(112, 0)">
    <text class="mono" x="0" y="44" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="2.2">
      04 // PRODUCTION CAPABILITIES &amp; CERTIFIED INFRASTRUCTURE
    </text>
    <text x="0" y="77" font-size="25" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
      Production Matrix &amp; 15 Professional Certs
    </text>
  </g>

  <!-- Right Telemetry Badge -->
  <g transform="translate(720, 42)">
    <rect x="0" y="0" width="150" height="26" rx="13" fill="#0E1626" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.5" />
    <circle cx="14" cy="13" r="3.5" fill="#38BDF8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text class="mono" x="25" y="17" font-size="10" font-weight="700" fill="#38BDF8" letter-spacing="0.8">15 CERTS // VERIFIED</text>
  </g>

  <!-- Bottom Accent Trace -->
  <path d="M 40 108 L 860 108" stroke="url(#sec3-accent)" stroke-width="2" stroke-linecap="round" />
</svg>
