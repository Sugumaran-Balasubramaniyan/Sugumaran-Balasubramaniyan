<svg xmlns="http://www.w3.org/2000/svg" width="780" height="214" viewBox="0 0 780 214" role="img" aria-labelledby="t5 d5">
  <title id="t5">SKEMA Business School Paris - Faculty Chair &amp; Research</title>
  <desc id="d5">Professor of AI &amp; Data Science at SKEMA Business School Paris, directing MSc curricula on Advanced ML, Enterprise RAG, and supervising 500+ postgraduates.</desc>
  <defs>
    <radialGradient id="r5" cx="0.88" cy="0.5" r="0.8">
      <stop stop-color="#7AA2F7" stop-opacity="0.14" />
      <stop offset="1" stop-color="#7AA2F7" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid5" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sweep { animation: sweep 10s linear infinite; }
    .pulse { animation: pulse 3s ease-in-out infinite; }
    @keyframes sweep { to { stroke-dashoffset: -100; } }
    @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .sweep, .pulse { animation: none !important; } }
  </style>

  <!-- Background Base & Grid -->
  <rect x="0.5" y="0.5" width="779" height="213" rx="14" fill="#080C14" stroke="#1E293B" stroke-width="1.2" />
  <rect x="0.5" y="0.5" width="779" height="213" rx="14" fill="url(#grid5)" />
  <rect x="0.5" y="0.5" width="779" height="213" rx="14" fill="url(#r5)" />

  <!-- Animated Border Sweep -->
  <rect class="sweep" x="0.5" y="0.5" width="779" height="213" rx="14" fill="none" stroke="#7AA2F7" stroke-width="1.3" pathLength="100" stroke-dasharray="10 90" stroke-linecap="round" />

  <!-- Right Graphic: Academic Crest & Neural Pedagogy Synapse -->
  <g transform="translate(650, 107)">
    <circle r="68" fill="none" stroke="#7AA2F7" stroke-opacity="0.15" />
    <circle r="46" fill="none" stroke="#7AA2F7" stroke-opacity="0.25" stroke-dasharray="2 2" />

    <!-- Academic Mortarboard / Knowledge Temple Portal -->
    <path d="M 0 -24 L 28 -12 L 0 0 L -28 -12 Z" fill="#0E1626" stroke="#7AA2F7" stroke-width="1.5" />
    <path d="M 20 -8 L 20 14 C 20 14 0 24 -20 14 L -20 -8" fill="none" stroke="#00F2FE" stroke-width="1.3" />
    
    <!-- Tassel & Pendant -->
    <line x1="28" y1="-12" x2="34" y2="4" stroke="#00FF87" stroke-width="1.2" />
    <circle cx="34" cy="6" r="2.5" fill="#00FF87" />

    <!-- Center Pulse -->
    <circle cx="0" cy="-12" r="4.5" fill="#00F2FE" class="pulse" />
    
    <!-- Coordinate Subtext -->
    <text class="m" x="0" y="38" text-anchor="middle" font-size="8.5" fill="#7AA2F7" letter-spacing="1">PARIS // 48.89 N</text>
  </g>

  <!-- Left Content Column -->
  <g transform="translate(32, 0)">
    <!-- Monospace Tag -->
    <text class="m" x="0" y="38" font-size="11" font-weight="700" letter-spacing="1.5" fill="#7AA2F7">05 · ACADEMIC CHAIR &amp; RESEARCH LEADERSHIP</text>

    <!-- Title -->
    <text x="0" y="74" font-size="26" font-weight="700" fill="#FFFFFF">SKEMA Business School (Paris)</text>

    <!-- Specs Bullets -->
    <text x="0" y="105" font-size="13.5" fill="#C9D1D9">Professor of AI &amp; Data Science at SKEMA Business School (Grand Paris Campus).</text>
    <text x="0" y="126" font-size="13.5" fill="#C9D1D9">Leading postgraduate MSc curricula on Advanced ML, Enterprise RAG &amp; AI Governance.</text>
    <text x="0" y="147" font-size="13.5" fill="#C9D1D9">Supervising 500+ postgraduate theses &amp; applied industry research partnerships.</text>

    <!-- Pill Badges -->
    <g transform="translate(0, 172)">
      <rect x="0" y="0" width="104" height="22" rx="11" fill="#0E1626" stroke="#7AA2F7" stroke-opacity="0.35" />
      <text class="m" x="52" y="15" text-anchor="middle" font-size="10.5" fill="#7AA2F7" font-weight="600">SKEMA Paris</text>

      <rect x="112" y="0" width="112" height="22" rx="11" fill="#0E1626" stroke="#7AA2F7" stroke-opacity="0.35" />
      <text class="m" x="168" y="15" text-anchor="middle" font-size="10.5" fill="#7AA2F7" font-weight="600">MSc Curricula</text>

      <rect x="232" y="0" width="108" height="22" rx="11" fill="#0E1626" stroke="#7AA2F7" stroke-opacity="0.35" />
      <text class="m" x="286" y="15" text-anchor="middle" font-size="10.5" fill="#7AA2F7" font-weight="600">AI Governance</text>

      <rect x="348" y="0" width="102" height="22" rx="11" fill="#0E1626" stroke="#7AA2F7" stroke-opacity="0.35" />
      <text class="m" x="399" y="15" text-anchor="middle" font-size="10.5" fill="#7AA2F7" font-weight="600">500+ Theses</text>
    </g>
  </g>

  <!-- External Link Arrow (Top Right) -->
  <path d="M 742 32 L 752 22 M 744 22 H 752 V 30" fill="none" stroke="#7AA2F7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
</svg>
