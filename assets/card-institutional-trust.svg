<svg xmlns="http://www.w3.org/2000/svg" width="780" height="214" viewBox="0 0 780 214" role="img" aria-labelledby="t-inst d-inst">
  <title id="t-inst">ETSI, RAISE Summit &amp; MACHINA Summit Ambassadorships</title>
  <desc id="d-inst">Ambassador for ETSI AI Standardization, RAISE Summit Generative AI in Paris, and MACHINA Summit Physical AI and Humanoid Robotics ecosystem.</desc>
  <defs>
    <radialGradient id="r-inst" cx="0.88" cy="0.5" r="0.8">
      <stop stop-color="#F5B83D" stop-opacity="0.14" />
      <stop offset="1" stop-color="#F5B83D" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid-inst" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sweep { animation: sweep 10s linear infinite; }
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes sweep { to { stroke-dashoffset: -100; } }
    @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .sweep, .pulse { animation: none !important; } }
  </style>

  <!-- Background Base & Grid -->
  <rect x="0.5" y="0.5" width="779" height="213" rx="14" fill="#080C14" stroke="#1E293B" stroke-width="1.2" />
  <rect x="0.5" y="0.5" width="779" height="213" rx="14" fill="url(#grid-inst)" />
  <rect x="0.5" y="0.5" width="779" height="213" rx="14" fill="url(#r-inst)" />

  <!-- Animated Border Sweep in Gold -->
  <rect class="sweep" x="0.5" y="0.5" width="779" height="213" rx="14" fill="none" stroke="#F5B83D" stroke-width="1.3" pathLength="100" stroke-dasharray="10 90" stroke-linecap="round" />

  <!-- Right Graphic: European Standards Crest & Interlocking Summit Nodes -->
  <g transform="translate(650, 107)">
    <circle r="68" fill="none" stroke="#F5B83D" stroke-opacity="0.15" />
    <circle r="46" fill="none" stroke="#F5B83D" stroke-opacity="0.25" stroke-dasharray="3 3" />

    <!-- European Standards Shield -->
    <path d="M 0 -26 L 24 -12 V 10 C 24 24 0 34 0 34 C 0 34 -24 24 -24 10 V -12 Z" fill="#0E1626" stroke="#F5B83D" stroke-width="1.4" />
    
    <!-- Inner Emblem: Trust & Physical AI -->
    <circle cx="0" cy="2" r="7" fill="none" stroke="#00F2FE" stroke-width="1.2" />
    <circle cx="0" cy="2" r="3" fill="#F5B83D" class="pulse" />
    
    <!-- Stars / Satellite Accents -->
    <circle cx="-12" cy="-8" r="1.8" fill="#F5B83D" />
    <circle cx="12" cy="-8" r="1.8" fill="#F5B83D" />
  </g>

  <!-- Left Content Column -->
  <g transform="translate(32, 0)">
    <!-- Monospace Tag in Gold -->
    <text class="m" x="0" y="38" font-size="11" font-weight="700" letter-spacing="1.5" fill="#F5B83D">08 · INDUSTRY AMBASSADOR &amp; STANDARDS</text>

    <!-- Title -->
    <text x="0" y="74" font-size="25" font-weight="700" fill="#FFFFFF">ETSI • RAISE • MACHINA Summits</text>

    <!-- Specs Bullets -->
    <text x="0" y="105" font-size="13.5" fill="#C9D1D9">Ambassador @ ETSI (European Telecommunications Standards Institute) for AI trust.</text>
    <text x="0" y="126" font-size="13.5" fill="#C9D1D9">Ambassador @ RAISE Summit Paris advancing enterprise Generative AI adoption.</text>
    <text x="0" y="147" font-size="13.5" fill="#C9D1D9">Founding Ambassador @ MACHINA Summit (Physical AI, robotics &amp; embodied systems).</text>

    <!-- Pill Badges -->
    <g transform="translate(0, 172)">
      <rect x="0" y="0" width="128" height="22" rx="11" fill="#0E1626" stroke="#F5B83D" stroke-opacity="0.35" />
      <text class="m" x="64" y="15" text-anchor="middle" font-size="10.5" fill="#F5B83D" font-weight="600">ETSI Ambassador</text>

      <rect x="136" y="0" width="104" height="22" rx="11" fill="#0E1626" stroke="#F5B83D" stroke-opacity="0.35" />
      <text class="m" x="188" y="15" text-anchor="middle" font-size="10.5" fill="#F5B83D" font-weight="600">RAISE Paris</text>

      <rect x="248" y="0" width="134" height="22" rx="11" fill="#0E1626" stroke="#F5B83D" stroke-opacity="0.35" />
      <text class="m" x="315" y="15" text-anchor="middle" font-size="10.5" fill="#F5B83D" font-weight="600">MACHINA Physical AI</text>

      <rect x="390" y="0" width="96" height="22" rx="11" fill="#0E1626" stroke="#F5B83D" stroke-opacity="0.35" />
      <text class="m" x="438" y="15" text-anchor="middle" font-size="10.5" fill="#F5B83D" font-weight="600">AI Governance</text>
    </g>
  </g>

  <!-- External Link Arrow (Top Right) -->
  <path d="M 742 32 L 752 22 M 744 22 H 752 V 30" fill="none" stroke="#F5B83D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
</svg>
