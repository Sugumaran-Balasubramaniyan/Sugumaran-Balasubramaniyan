<svg xmlns="http://www.w3.org/2000/svg" width="780" height="214" viewBox="0 0 780 214" role="img" aria-labelledby="t3 d3">
  <title id="t3">hermes-agent</title>
  <desc id="d3">Autonomous AI Agent Framework featuring terminal execution engines, workspace isolation, cron scheduling, subagent mesh coordination, and MCP server integrations.</desc>
  <defs>
    <radialGradient id="r3" cx="0.88" cy="0.5" r="0.8">
      <stop stop-color="#38BDF8" stop-opacity="0.14" />
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sweep { animation: sweep 10s linear infinite; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 16s linear infinite; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    @keyframes sweep { to { stroke-dashoffset: -100; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .sweep, .spin, .pulse { animation: none !important; } }
  </style>

  <!-- Background Base & Grid -->
  <rect x="0.5" y="0.5" width="779" height="213" rx="14" fill="#080C14" stroke="#1E293B" stroke-width="1.2" />
  <rect x="0.5" y="0.5" width="779" height="213" rx="14" fill="url(#grid3)" />
  <rect x="0.5" y="0.5" width="779" height="213" rx="14" fill="url(#r3)" />

  <!-- Animated Border Sweep -->
  <rect class="sweep" x="0.5" y="0.5" width="779" height="213" rx="14" fill="none" stroke="#38BDF8" stroke-width="1.3" pathLength="100" stroke-dasharray="10 90" stroke-linecap="round" />

  <!-- Right Graphic: Agent Terminal & Subagent Mesh -->
  <g transform="translate(650, 107)">
    <circle r="68" fill="none" stroke="#38BDF8" stroke-opacity="0.15" />
    <circle r="46" fill="none" stroke="#38BDF8" stroke-opacity="0.25" stroke-dasharray="4 4" class="spin" />

    <!-- Terminal Window Mini-Frame -->
    <rect x="-34" y="-24" width="68" height="48" rx="6" fill="#0B132B" stroke="#38BDF8" stroke-width="1.2" />
    <line x1="-34" y1="-12" x2="34" y2="-12" stroke="#1E293B" stroke-width="0.8" />
    <circle cx="-26" cy="-18" r="1.8" fill="#FF5F56" />
    <circle cx="-20" cy="-18" r="1.8" fill="#FFBD2E" />
    <circle cx="-14" cy="-18" r="1.8" fill="#27C93F" />

    <!-- Terminal Prompt & Command -->
    <text class="m" x="-26" y="2" font-size="8.5" fill="#00FF87">&gt; agy --run</text>
    <line x1="-26" y1="12" x2="-2" y2="12" stroke="#38BDF8" stroke-width="1.2" />

    <!-- Orbiting Mesh Nodes -->
    <circle cx="-42" cy="-30" r="3" fill="#00F2FE" />
    <circle cx="44" cy="-28" r="3" fill="#7AA2F7" />
    <circle cx="40" cy="32" r="3" fill="#00FF87" class="pulse" />
  </g>

  <!-- Left Content Column -->
  <g transform="translate(32, 0)">
    <!-- Monospace Tag -->
    <text class="m" x="0" y="38" font-size="11" font-weight="700" letter-spacing="1.5" fill="#38BDF8">03 · AUTONOMOUS AGENT RUNTIME</text>

    <!-- Title -->
    <text x="0" y="74" font-size="26" font-weight="700" fill="#FFFFFF">hermes-agent</text>

    <!-- Specs Bullets -->
    <text x="0" y="105" font-size="13.5" fill="#C9D1D9">Terminal execution engine with workspace isolation &amp; cron scheduling loops.</text>
    <text x="0" y="126" font-size="13.5" fill="#C9D1D9">Subagent mesh coordination, tool telemetry, and Model Context Protocol (MCP).</text>
    <text x="0" y="147" font-size="13.5" fill="#C9D1D9">Deterministic execution guardrails preventing runaway state &amp; token exhaustion.</text>

    <!-- Pill Badges -->
    <g transform="translate(0, 172)">
      <rect x="0" y="0" width="76" height="22" rx="11" fill="#0E1626" stroke="#38BDF8" stroke-opacity="0.35" />
      <text class="m" x="38" y="15" text-anchor="middle" font-size="10.5" fill="#38BDF8" font-weight="600">AsyncIO</text>

      <rect x="84" y="0" width="96" height="22" rx="11" fill="#0E1626" stroke="#38BDF8" stroke-opacity="0.35" />
      <text class="m" x="132" y="15" text-anchor="middle" font-size="10.5" fill="#38BDF8" font-weight="600">Multi-Agent</text>

      <rect x="188" y="0" width="108" height="22" rx="11" fill="#0E1626" stroke="#38BDF8" stroke-opacity="0.35" />
      <text class="m" x="242" y="15" text-anchor="middle" font-size="10.5" fill="#38BDF8" font-weight="600">MCP Protocol</text>

      <rect x="304" y="0" width="86" height="22" rx="11" fill="#0E1626" stroke="#38BDF8" stroke-opacity="0.35" />
      <text class="m" x="347" y="15" text-anchor="middle" font-size="10.5" fill="#38BDF8" font-weight="600">Linux CLI</text>
    </g>
  </g>

  <!-- External Link Arrow (Top Right) -->
  <path d="M 742 32 L 752 22 M 744 22 H 752 V 30" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
</svg>
